---
Name: silvershop-search-typesense
After:
  - '#silvershop-search'
---
# Register the Typesense backend. Set `active_backend: typesense` (and the SS_TYPESENSE_* env) to use it.
SilverShop\Search\Backend\BackendRegistry:
  backends:
    typesense: '%$SilverShop\Search\Typesense\TypesenseBackend'

# Keep the product collection in sync on publish / unpublish / delete.
SilverShop\Page\Product:
  extensions:
    - SilverShop\Search\Typesense\ProductSyncExtension

# CMS-editable search synonyms.
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverShop\Search\Typesense\SearchConfigExtension

# Instant-search JSON endpoint at /<search-page>/instant?q=…
SilverShop\Search\SearchPageController:
  extensions:
    - SilverShop\Search\Typesense\InstantSearchExtension
